name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Fly.io
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resolve-ai-mvp-fiap.fly.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://resolve-ai-mvp-fiap.fly.dev/up || true)
            [ "$status" = "200" ] && echo "Health check OK" && exit 0
            echo "Attempt $i: /up returned $status, retrying..."
            sleep 6
          done
          echo "Health check failed after deploy" && exit 1
