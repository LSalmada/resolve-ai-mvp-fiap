<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172E72"/>
      <stop offset="1" stop-color="#0C235F"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58E5AD"/>
      <stop offset="1" stop-color="#3DDB9B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071842" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect x="28" y="28" width="456" height="456" rx="86" fill="url(#bg)"/>

  <!-- Side buildings -->
  <path d="M102 318V202l67-35v151z" fill="#B7C3E0"/>
  <path d="M343 317V174l67 36v107z" fill="#B7C3E0"/>

  <!-- Side windows -->
  <g fill="#172E72">
    <rect x="122" y="224" width="22" height="27" rx="5"/>
    <rect x="122" y="271" width="22" height="27" rx="5"/>
    <rect x="368" y="225" width="22" height="27" rx="5"/>
  </g>

  <!-- Central building -->
  <path d="M174 325V137c0-8 4-14 11-18l70-39 70 39c7 4 11 10 11 18v188l-76 47z"
        fill="#FAFAFA" filter="url(#shadow)"/>

  <!-- Central windows -->
  <g fill="#172E72">
    <rect x="204" y="135" width="25" height="28" rx="6"/>
    <rect x="278" y="135" width="25" height="28" rx="6"/>
    <rect x="204" y="184" width="25" height="28" rx="6"/>
    <rect x="278" y="184" width="25" height="28" rx="6"/>
    <rect x="204" y="233" width="25" height="28" rx="6"/>
    <rect x="278" y="233" width="25" height="28" rx="6"/>
    <rect x="204" y="282" width="25" height="28" rx="6"/>
  </g>

  <!-- Check mark -->
  <path d="M164 333 L236 404 L386 273"
        fill="none"
        stroke="#0B225D"
        stroke-width="64"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".9"/>
  <path d="M164 333 L236 404 L386 273"
        fill="none"
        stroke="url(#check)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Subtle highlight -->
  <path d="M80 130C120 80 180 55 256 55"
        fill="none" stroke="#FFFFFF" stroke-opacity=".06"
        stroke-width="3" stroke-linecap="round"/>
</svg>