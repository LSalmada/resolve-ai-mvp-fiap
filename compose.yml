services:
  db:
    image: postgres:16
    container_name: resolve-ai-mvp-fiap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/resolve_ai_mvp_fiap_production
      CACHE_DATABASE_URL: postgres://postgres:postgres@db:5432/resolve_ai_mvp_fiap_production_cache
      QUEUE_DATABASE_URL: postgres://postgres:postgres@db:5432/resolve_ai_mvp_fiap_production_queue
      CABLE_DATABASE_URL: postgres://postgres:postgres@db:5432/resolve_ai_mvp_fiap_production_cable
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-compose-only-not-for-real-deploys-0123456789abcdef0123456789abcdef}
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    volumes:
      - app_storage:/rails/storage

volumes:
  postgres_data:
  app_storage:
